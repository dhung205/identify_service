server:
  port: 8080
  servlet:
    context-path: /identify

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/identify_service"
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: root
    password: root
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  signerKey : "3f73be130cf60d0f347d0519e95a7928c57e992568c149ef3c39902f07d66487"
  valid-duration: 3600 # in second
  refreshable-duration: 360000 # in seconds
